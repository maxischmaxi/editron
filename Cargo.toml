[package]
name = "editron"
version = "0.1.0"
edition = "2021"
description = "Editron — natives Videoschnittprogramm (Rust + raylib)"

[dependencies]
raylib = "5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"

# Apple-Event-Handling („Öffnen mit“) — nur macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
